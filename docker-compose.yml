# ---------------------------------------------------------------------------
# Clúster Kafka local: 1 broker en modo KRaft (sin Zookeeper) + creación
# explícita del tópico + Kafka UI para ver el flujo de datos.
#
#   docker compose up -d
# ---------------------------------------------------------------------------
services:

  # --- 1. Broker de Kafka (KRaft: el mismo proceso es broker y controller) ---
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092" # listener EXTERNAL: lo usan producer y consumer desde el host
    environment:
      # Identidad y rol del nodo en KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"

      # Listeners: tres "puertas" al mismo proceso.
      #   INTERNAL   (kafka:29092)     -> contenedores de la red de Docker (kafka-init, kafka-ui)
      #   EXTERNAL   (localhost:9092)  -> scripts de Python que corren en el host
      #   CONTROLLER (kafka:9093)      -> tráfico interno de KRaft
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # Dirección que el broker le DEVUELVE a cada cliente para seguir hablando.
      # Si esto está mal, el cliente conecta pero después falla (error común).
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      # Un solo broker: los tópicos internos no pueden replicarse más de 1 vez
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Rebalance inmediato al sumar/quitar consumidores (útil para la demo)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Evita el error común: que el producer autocree el tópico con 1 partición.
      # Si el tópico no existe, el producer falla con un error claro.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # --- 2. Creación explícita del tópico (corre una vez y termina) ---
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic server_metrics \
          --partitions 3 \
          --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --describe --topic server_metrics
    restart: "no"

  # --- 3. Kafka UI: interfaz web para ver tópicos, particiones y mensajes ---
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080" # http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # OJO: desde la red de Docker se usa el listener INTERNAL, no localhost
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
